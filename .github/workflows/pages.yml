name: Publicera till GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Bygg sajten
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          mkdir _site
          cp index.html style.css game.js locations.js puzzles.js countries.js config.js _site/
          if [ -n "$GOOGLE_MAPS_API_KEY" ]; then
            printf 'window.GAME_CONFIG.GOOGLE_MAPS_API_KEY = "%s";\n' "$GOOGLE_MAPS_API_KEY" > _site/config.local.js
          else
            echo "// Ingen nyckel inlagd som hemlighet. Spelet körs i demoläge." > _site/config.local.js
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
